apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: k8s-lab
  labels:
    app: demo-app
    version: v3-broken
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v3-broken
    spec:
      containers:
        - name: web
          image: node:20-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v3.0.0 (Broken Release)"
            - name: BG_COLOR
              value: "#dc2626"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            # Intentionally points to non-existent endpoint to simulate failure
            httpGet:
              path: /does-not-exist-fail
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: code-volume
              mountPath: /app
      volumes:
        - name: code-volume
          configMap:
            name: demo-app-source
