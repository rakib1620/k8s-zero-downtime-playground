apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: k8s-lab
  labels:
    app: demo-app
    version: v1
spec:
  replicas: 4
  revisionHistoryLimit: 5
  minReadySeconds: 7 # Gives 7s pause after pod ready so you can observe the rolling update
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Max pods created above desired count (25% for 4 pods)
      maxUnavailable: 0    # Ensures ZERO downtime by never terminating before new is ready
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v1
    spec:
      containers:
        - name: web
          image: node:20-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1.0.0 (Blue)"
            - name: BG_COLOR
              value: "#2563eb"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: code-volume
              mountPath: /app
      volumes:
        - name: code-volume
          configMap:
            name: demo-app-source
